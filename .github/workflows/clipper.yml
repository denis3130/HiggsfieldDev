name: GTA6 Auto-Clipper

on:
  schedule:
    # ogni 3 ore (UTC) → 8 giri al giorno; ogni giro riempie la coda fino a 2 giorni di slot
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Produci gli Short senza caricarli"
        type: boolean
        default: false
      max:
        description: "Massimo Short in questo giro (vuoto = automatico)"
        required: false

concurrency:
  group: clipper
  cancel-in-progress: false

permissions:
  contents: write   # per salvare data/state.json (anti-duplicati) nel repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa ffmpeg e font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Installa dipendenze
        run: pip install -r requirements.txt && pip install -U yt-dlp

      - name: Cache modello Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Controllo configurazione
        run: python -m clipper doctor || true

      - name: Test
        run: python -m pytest -q

      - name: Esegui pipeline
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.max }}" ]; then ARGS="$ARGS --max ${{ inputs.max }}"; fi
          python -m clipper run $ARGS

      - name: Salva stato anti-duplicati
        if: always()
        run: |
          git config user.name "gta6-clipper-bot"
          git config user.email "gta6-clipper-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: aggiorna stato clipper [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done

      - name: Allega Short prodotti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore
